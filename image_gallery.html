
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四宫格图片展示</title>
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .gallery-container {
            max-width: 1200px;
            padding: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .grid-item:hover {
            transform: scale(1.05);
        }

        .grid-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
            
            .grid-item img {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <h1 style="text-align: center; color: #333; margin-bottom: 30px;">期货数据（郑棉）</h1>
        <div class="grid-container">
            <div class="grid-item">
                <img src="image1.jpg" alt="图片1">
                <div class="caption">图片1:加工量</div>
            </div>
            <div class="grid-item">
                <img src="image2.jpg" alt="图片2">
                <div class="caption">图片2:后道利润</div>
            </div>
            <div class="grid-item">
                <img src="image3.jpg" alt="图片3">
                <div class="caption">图片3:郑棉基差</div>
            </div>
            <div class="grid-item">
                <img src="image4.jpg" alt="图片4">
                <div class="caption">图片4:销售进度</div>
            </div>
        </div>
    </div>
</body>
</html>
